[project]
name = "mediacrawler"
authors = [{name = "程序员阿江-Relakkes", email = "relakkes@gmail.com"}]
version = "0.1.0"
description = "A social media crawler project, support Xiaohongshu, Weibo, Zhihu, Bilibili, Douyin, BaiduTieBa etc."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles~=23.2.1",
    "aiomysql==0.2.0",
    "aiosqlite>=0.21.0",
    "alembic>=1.16.5",
    "asyncmy>=0.2.10",
    "cryptography>=45.0.7",
    "fastapi==0.110.2",
    "httpx==0.28.1",
    "jieba==0.42.1",
    "matplotlib>=3.11.0",
    "motor>=3.3.0",
    "opencv-python>=4.11.0.86",
    "pandas==2.2.3",
    "parsel==1.9.1",
    "pillow>=12.2.0",
    "playwright>=1.61.0",
    "pydantic>=2.13.4",
    "pyexecjs==1.5.1",
    "pyhumps>=3.8.0",
    "python-dotenv==1.0.1",
    "redis~=4.6.0",
    "requests==2.32.3",
    "sqlalchemy>=2.0.43",
    "tenacity==8.2.2",
    "typer>=0.12.3",
    "uvicorn==0.29.0",
    "wordcloud>=1.9.6",
    "pre-commit>=3.5.0",
    "openpyxl>=3.1.2",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "websockets>=15.0.1",
    "asyncpg>=0.31.0",
    "xhshow>=0.2.0",
    "filelock>=3.20.0",
    "psutil>=7.2.2",
    "qrcode>=8.2",
    "platformdirs>=4.5.0",
    "m3u8>=6,<7",
    "markdownify>=1.1,<2",
    "beautifulsoup4>=4.12,<5",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
ocr = [
    "onnxruntime>=1.31.1",
    "rapidocr>=3",
]

[tool.uv]
# 图片转文字直接在项目环境里调用 rapidocr；打包时排除，安装版体积不变
default-groups = ["ocr"]

[project.scripts]
mediacrawler = "mediacrawler_cli.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mediacrawler_cli*", "desktop*", "media_platform*", "store*", "config*", "tools*", "model*", "base*", "cache*", "proxy*", "database*", "libs*", "constant*", "cmd_arg*", "media_downloader*"]
exclude = ["desktop.tests*"]

[tool.setuptools]
py-modules = ["var"]

[tool.setuptools.package-data]
"*" = ["*.js", "*.graphql"]

[tool.pytest.ini_options]
testpaths = ["tests/cli", "desktop/tests"]
asyncio_mode = "auto"
